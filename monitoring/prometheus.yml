global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: poshraw-api
    metrics_path: /internal/metrics
    bearer_token_file: /run/secrets/metrics_bearer_token
    static_configs:
      - targets: ['${POSHRAW_METRICS_TARGET}']

  - job_name: poshraw-health
    metrics_path: /probe
    params:
      module: [https_forwarded]
    static_configs:
      - targets:
          - '${POSHRAW_HEALTH_TARGET}'
          - '${POSHRAW_NOTIFICATION_TARGET}'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
