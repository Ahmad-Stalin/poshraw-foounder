global:
  resolve_timeout: 5m
  smtp_smarthost: ${ALERT_SMTP_HOST}
  smtp_from: ${ALERT_SMTP_FROM}
  smtp_auth_username: ${ALERT_SMTP_USERNAME}
  smtp_auth_password: ${ALERT_SMTP_PASSWORD}
  smtp_require_tls: ${ALERT_SMTP_REQUIRE_TLS}

route:
  receiver: poshraw-operators
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: poshraw-operators
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        send_resolved: true
